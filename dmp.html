function renderRoute(){return (PAGES[state.route]||pageDashboard)();}
function go(path){
  if(!ROUTE_TITLE[path])return;
  state.route=path;state.drawer=false;
  if(!state.tabs.some(function(t){return t.path===path;}))state.tabs.push({path:path,title:ROUTE_TITLE[path]});
  renderShell();
  const c=document.getElementById('content');
  if(c)c.scrollTop=0;
}
function closeTab(e,path){
  e.stopPropagation();
  const i=state.tabs.findIndex(function(t){return t.path===path;});
  if(i<0)return;
  state.tabs.splice(i,1);
  if(state.route===path){const nx=state.tabs[Math.max(0,i-1)];state.route=nx?nx.path:'/index';}
  renderShell();
}
function toggleNav(k){state.navOpen[k]=!state.navOpen[k];renderShell();}
function toggleDrawer(v){state.drawer=v;renderShell();}
function tickClock(){
  const el=document.getElementById('clock');
  if(!el)return;
  const d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  el.textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

        '</div>'+

        '<button class="btn btn-primary" onclick="cfSave()">保存</button>'+
      '</div>'+
    '</div>'
  );
  renderCfList();
}
function renderCfList(){
  const g=COUNTRY_GROUPS.find(function(x){return x.key===cfState.group;});
  const kw=(cfState.keyword||'').trim();
  let list=g.list;
  if(kw) list=list.filter(function(c){return c.indexOf(kw)>-1;});
  const box=document.getElementById('cf-list');
  if(!box)return;
  if(!list.length){
    box.innerHTML='<div style="padding:40px 20px;text-align:center;color:#c9cdd4;font-size:13px">未找到相關國家</div>';
  } else {
    box.innerHTML='<div class="cf-grid">'+list.map(function(c){
      const on=!!cfState.selected[c];
      return '<label class="cf-cell"><input type="checkbox" data-c="'+esc(c)+'"'+(on?' checked':'')+' onchange="cfPick(this)" /><span title="'+esc(c)+'">'+c+'</span></label>';
    }).join('')+'</div>';
  }
  const cnt=Object.keys(cfState.selected).filter(function(k){return cfState.selected[k];}).length;
  const ce=document.getElementById('cf-count'); if(ce)ce.textContent=cnt;
  const all=document.getElementById('cf-all');
  if(all) all.checked = list.length>0 && list.every(function(c){return cfState.selected[c];});
  document.querySelectorAll('.cf-side-item').forEach(function(b){
    b.classList.toggle('active',b.dataset.k===cfState.group);
  });
}
function cfGroup(k){ cfState.group=k; cfState.keyword=''; const s=document.getElementById('cf-search'); if(s)s.value=''; renderCfList(); }
function cfSearch(v){ cfState.keyword=v; renderCfList(); }
function cfPick(el){
  cfState.selected[el.dataset.c]=el.checked;
  renderCfList();
}
function cfToggleAll(checked){
  const g=COUNTRY_GROUPS.find(function(x){return x.key===cfState.group;});
  const kw=(cfState.keyword||'').trim();
  let list=g.list;
  if(kw) list=list.filter(function(c){return c.indexOf(kw)>-1;});
  list.forEach(function(c){ cfState.selected[c]=checked; });
  renderCfList();
}
function closeCountryFilter(){ closeModal(); }
function cfSave(){
  const cnt=Object.keys(cfState.selected).filter(function(k){return cfState.selected[k];}).length;
  closeModal();
  toast('已保存，共過濾 '+cnt+' 個國家');
}

function setCoefTab(t){state.coefTab=t;renderShell();}
function stepCoef(delta){
  const el=document.getElementById('coef-val');
  if(!el)return;
  let v=parseFloat(el.value)||1;
  v=Math.min(10,Math.max(0.01,+(v+delta).toFixed(2)));
  el.value=v.toFixed(2);syncCalc();
}
function syncCalc(){
  const el=document.getElementById('coef-val');
  if(!el)return;
  let k=parseFloat(el.value);
  if(isNaN(k)||k<=0){k=1;el.value='1.00';}
  const yq=0.47*k,nq=0.53*k;
  const set=function(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt;};
  set('yes-q','0.47 × '+k.toFixed(2)+' = '+yq.toFixed(4));
  set('yes-odd','1 / '+yq.toFixed(4)+' = '+(1/yq).toFixed(2)+'x');
  set('no-q','0.53 × '+k.toFixed(2)+' = '+nq.toFixed(4));
  set('no-odd','1 / '+nq.toFixed(4)+' = '+(1/nq).toFixed(2)+'x');
}

function togglePermGroup(el){
  const row=el.closest('.perm-row');
  const gid=row.querySelector('input[data-g]').dataset.g;
  const bodies=document.querySelectorAll('.perm-body[data-parent="'+gid+'"]');
  const hidden=bodies.length&&bodies[0].style.display==='none';
  bodies.forEach(function(b){b.style.display=hidden?'':'none';});
  el.style.transform=hidden?'':'rotate(-90deg)';
}
function toggleChild(cid,checked){
  document.querySelectorAll('input[data-c="'+cid+'"]').forEach(function(i){i.checked=checked;});
  const gid=document.querySelector('input[data-c="'+cid+'"]').dataset.g;
  syncGroup(gid);
}
function toggleAllPerm(gid,checked){
  document.querySelectorAll('input[data-g="'+gid+'"]').forEach(function(i){i.checked=checked;});
}
function syncGroup(gid){
  const all=document.querySelectorAll('input[data-g="'+gid+'"][data-c]');
  const on=document.querySelectorAll('input[data-g="'+gid+'"][data-c]:checked');
  const g=document.querySelector('input[data-g="'+gid+'"]:not([data-c])');
  if(g)g.checked=all.length>0&&all.length===on.length;
}
function closeTabEvent(path){

/* 下拉浮層：錨定觸發按鈕下方，右對齊 */
let popoverEl=null;
function openPopover(html,anchor){
  closePopover();
  if(!anchor)return;
  const mask=document.createElement('div');
  mask.className='popover-mask';
  mask.onclick=closePopover;
  const box=document.createElement('div');
  box.className='popover';
  box.innerHTML=html;
  document.body.appendChild(mask);
  document.body.appendChild(box);
  const r=anchor.getBoundingClientRect();
  const w=box.offsetWidth||252;
  let left=r.right-w;
  if(left<12)left=12;
  let top=r.bottom+8;
  box.style.left=left+'px';
  box.style.top=top+'px';
  popoverEl={mask:mask,box:box};
}
function closePopover(){
  if(!popoverEl)return;
  popoverEl.mask.remove();
  popoverEl.box.remove();
  popoverEl=null;
}

/* 用純 CSS/HTML 生成一個示意二維碼（非真實可掃碼，僅原型展示） */
function fakeQr(seed,size){
  const n=25, cell=size/n;
  let rects='';
  let h=0;
  for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  const rnd=function(){ h=(h*1103515245+12345)>>>0; return h/4294967296; };
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      // 三個定位角保持實心
      const inFinder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
      if(inFinder) continue;
      if(rnd()>0.55) rects+='<rect x="'+(x*cell).toFixed(2)+'" y="'+(y*cell).toFixed(2)+'" width="'+cell.toFixed(2)+'" height="'+cell.toFixed(2)+'" fill="#1d2129"/>';
    }
  }
  const finder=function(fx,fy){
    return '<rect x="'+(fx*cell).toFixed(2)+'" y="'+(fy*cell).toFixed(2)+'" width="'+(7*cell).toFixed(2)+'" height="'+(7*cell).toFixed(2)+'" fill="#1d2129"/>'+
      '<rect x="'+((fx+1)*cell).toFixed(2)+'" y="'+((fy+1)*cell).toFixed(2)+'" width="'+(5*cell).toFixed(2)+'" height="'+(5*cell).toFixed(2)+'" fill="#fff"/>'+
      '<rect x="'+((fx+2)*cell).toFixed(2)+'" y="'+((fy+2)*cell).toFixed(2)+'" width="'+(3*cell).toFixed(2)+'" height="'+(3*cell).toFixed(2)+'" fill="#1d2129"/>';
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block">'+
    '<rect width="'+size+'" height="'+size+'" fill="#fff"/>'+rects+
    finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>';
}

            'oninput="onMfaInput(this)" />'+
          '<span id="mfa-count" style="color:#86909c;font-size:12px">有效時間 05:00</span>'+
        '</div>'+
        '<div class="form-error" id="mfa-err" style="display:none"></div>'+
      '</div>',
    foot:'<button class="btn btn-ghost" onclick="closeMfaBind()">取消</button>'+
      '<button class="btn btn-primary" id="mfa-submit" onclick="submitMfaBind()">確認綁定</button>'
  }));
  mfaLeft=300;
  startMfaCountdown();
  setTimeout(function(){ const i=document.getElementById('mfa-code'); if(i&&i.focus)i.focus(); },80);
}
function startMfaCountdown(){
  stopMfaCountdown();
  mfaTimer=setInterval(function(){
    mfaLeft--;
    const el=document.getElementById('mfa-count');
    if(!el){ stopMfaCountdown(); return; }
    if(mfaLeft<=0){
      el.textContent='已過期，請重新取得';
      el.style.color='#f53f3f';
      const s=document.getElementById('mfa-submit');
      if(s){ s.disabled=true; s.style.background='#a9c4f8'; s.style.cursor='not-allowed'; }
      stopMfaCountdown();
      return;
    }
    const m=String(Math.floor(mfaLeft/60)).padStart(2,'0');
    const s=String(mfaLeft%60).padStart(2,'0');
    el.textContent='有效時間 '+m+':'+s;
    el.style.color=mfaLeft<=60?'#ff7d00':'#86909c';
  },1000);
}
function stopMfaCountdown(){ if(mfaTimer){ clearInterval(mfaTimer); mfaTimer=null; } }
function onMfaInput(el){
  el.value=el.value.replace(/\D/g,'').slice(0,6);
  const err=document.getElementById('mfa-err');
  if(err) err.style.display='none';
}
function copyMfaSecret(){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(MFA_SECRET).then(function(){toast('密鑰已複製','info');},function(){toast('複製失敗，請手動選取','err');});
  } else { toast('密鑰：'+MFA_SECRET,'info'); }
}
function closeMfaBind(){ stopMfaCountdown(); closeModal(); }
function submitMfaBind(){
  const i=document.getElementById('mfa-code');
  const err=document.getElementById('mfa-err');
  const code=(i?i.value:'').trim();
  if(code.length!==6){
    if(err){ err.textContent='請輸入完整的 6 位驗證碼'; err.style.display='block'; }
    if(i){ i.closest('.field').classList.add('has-error'); }
    return;
  }
  stopMfaCountdown();
  closeModal();
  state.mfaBound=true;
  renderShell();
  toast('Google 驗證已綁定');
}
function openMfaUnbind(){
  openModal(modalShell({
    title:'解綁 Google 驗證',size:'narrow',
    body:'<div style="display:flex;gap:10px;padding:4px 0 8px">'+
      '<span style="color:#ff7d00;flex:0 0 auto">'+icon('warn',20)+'</span>'+
      '<div style="color:#4e5969;line-height:1.75">解綁後登入將不再校驗動態驗證碼，帳號安全性降低。<br/>確定要解綁嗎？</div></div>',
    foot:'<button class="btn btn-ghost" onclick="closeModal()">取消</button>'+
      '<button class="btn btn-danger" onclick="doUnbindMfa()">確定解綁</button>'
  }));
}
function doUnbindMfa(){
  closeModal();
  state.mfaBound=false;
  renderShell();
  toast('已解綁 Google 驗證','info');
}
function doLogout(){
  closePopover();
  state.loggedIn=false;
  state.route='/login';
  if(!state.tabs.some(function(t){return t.path==='/login';}))state.tabs.push({path:'/login',title:'登錄頁'});
  renderShell();
  toast('已登出','info');
}
function showVersion(){
  openModal(modalShell({
    title:'原型版本記錄',
    body:'<div class="alert-tip"><span class="i">'+icon('info',14)+'</span><span>本原型為界面與交互演示，數據為業務化 mock，不含真實後端邏輯。</span></div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px 0 16px">'+
      '<div class="ver-card"><div class="k">當前版本</div><div class="v">'+VERSION+'</div></div>'+
      '<div class="ver-card"><div class="k">發布日期</div><div class="v">'+BUILD_DATE+'</div></div>'+
      '<div class="ver-card"><div class="k">框架參考</div><div class="v">'+BASE_REF+'</div></div></div>'+
      '<div style="border-top:1px solid #eef1f6;padding-top:14px">'+
      '<div style="font-weight:600;margin-bottom:10px">變更記錄</div>'+
      '<div style="display:flex;gap:12px"><span class="vnum" style="align-self:flex-start">'+VERSION+'</span>'+
      '<div style="flex:1;color:#4e5969;font-size:12.5px;line-height:1.85">'+
      '<div style="color:#86909c;font-size:11.5px;margin-bottom:5px">'+BUILD_DATE+' · 首次發布</div>'+
      '依原站前端還原管理面 9 個業務頁面與 7 類彈窗；外框改為產品基線結構，新增「產品基線 · 規範」文檔頁；'+
      '字體按基線規範統一為 Outfit + 系統中文字體，配色沿用原站藍色體系。</div></div></div>',
    foot:'<button class="btn btn-primary" onclick="closeModal()">關閉</button>'
  }));
}

/* ---------- 啟動 ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(modalStack.length)closeModal();
    else closePopover();
  }
});
window.addEventListener('resize',closePopover);
window.addEventListener('scroll',closePopover,true);
setInterval(tickClock,1000);
renderShell();

</script>
</body>
