function renderSpec(){
  const navHtml=SPEC_NAV.map(function(g){
    return '<div class="spec-side-title">'+g.group+'</div>'+
      g.items.map(function(it){
        return '<div class="spec-link'+(state.specSection===it.id?' active':'')+'" onclick="setSpec(\''+it.id+'\')">'+
          '<span class="n num">'+it.n+'</span>'+it.label+
          (it.cnt?'<span class="cnt num">'+it.cnt+'</span>':'')+'</div>';
      }).join('');
  }).join('');
  return '<div class="spec"><aside class="spec-side">'+navHtml+'</aside>'+
    '<div class="spec-body">'+specContent()+'</div></div>';
}
function setSpec(id){state.specSection=id;renderShell();}
function specContent(){
  const s=state.specSection;
  if(s==='structure')return specStructure();
  if(s==='req')return specReq();
  if(s==='net')return specNet();
  if(s==='account')return specAccount();
  if(s==='loading')return specLoading();
  if(s==='empty')return specEmpty();
  if(s==='dict')return specDict();
  if(s==='algo')return specAlgo();
  if(s==='color')return specColor();
  if(s==='type')return specType();
  if(s==='icon')return specIcon();
  if(s==='comp')return specComp();
  if(s==='team')return specTeam();
  return specVersion();
}

      '<tr><td>卡片內邊距</td><td class="num">16px 18px</td><td>統計卡片與內容卡片同值，卡片之間間距 12px</td></tr>'+
      '<tr><td>彈窗內邊距</td><td class="num">24px</td><td>四邊等值，底部按鈕區單獨留 16px 上邊距</td></tr>'+

      '<tr><td>頁面留白</td><td class="num">16px 18px</td><td>內容區四周，縱向可滾動區域單獨扣除滾動條寬度</td></tr>'+
      '</tbody></table>'+
      '<div class="spec-note"><span class="i">'+icon('warn',16)+'</span><span><b>1px 只用於邊框。</b>padding、margin、gap 不寫奇數；需要 1px 級微調時，改外層留白或依靠 flex 居中，不在內邊距上湊數。連續同類容器之間補 <span class="mono-code">margin-top</span>，相鄰的 margin 不產生間隔。</span></div></div>'+
    '<div class="spec-block"><h3>八、令牌單一源</h3>'+
      '<p class="sub">顏色、字號、圓角、動效、布局尺寸五類令牌，只在 <span class="mono-code">assets/app.css</span> 的 <span class="mono-code">:root</span> 定義一次。</p>'+
      '<table class="spec-table"><thead><tr><th style="width:150px">令牌組</th><th style="width:210px">定義位置</th><th>引用與邊界</th></tr></thead><tbody>'+
      '<tr><td>顏色</td><td><span class="mono-code">assets/app.css :root</span></td><td>頁面內寫 <span class="mono-code">var(--primary)</span>，不寫十六進制。僅 SVG 的 <span class="mono-code">fill</span> / <span class="mono-code">stroke</span> 表現屬性保留字面值</td></tr>'+
      '<tr><td>字號</td><td>同上，七檔</td><td><span class="mono-code">var(--fs-body)</span> 等，不按場景新增檔位</td></tr>'+
      '<tr><td>圓角</td><td>同上，四檔</td><td><span class="mono-code">var(--r-md)</span> 等，四檔以外不新增數值</td></tr>'+
      '<tr><td>動效</td><td>同上，<span class="mono-code">--ease</span> + 兩檔時長</td><td>transition 寫具名屬性，不寫 <span class="mono-code">all</span></td></tr>'+
      '<tr><td>布局尺寸</td><td>同上，側欄 216 / 頂欄 60 / 頁籤 44</td><td><span class="mono-code">var(--sidebar-w)</span> 等，grid 列寬直接引用</td></tr>'+
      '<tr><td>獨立頁</td><td><span class="mono-code">index.html</span>、<span class="mono-code">api-alarm.html</span>、<span class="mono-code">api-detail.html</span> 各自 :root</td><td>不引用 app.css 的頁面，:root 內容與基線同名同值，缺一即靜默失效</td></tr>'+
      '</tbody></table>'+
      '<div class="spec-note red"><span class="i">'+icon('warn',16)+'</span><span><b>同一頁出現兩段 :root 時，加載順序在後的一段覆蓋前者，瀏覽器不報錯。</b>頁面實際顯示與本頁規範表不符時，先查是否有重複定義，再查是不是寫了字面值繞過令牌。</span></div>'+
      '<div class="spec-note blue"><span class="i">'+icon('info',16)+'</span><span><b>自查方法：</b>對引用與定義做一次集合比對 — 取文件中所有 <span class="mono-code">var(--x)</span> 的變數名，減去 <span class="mono-code">:root</span> 內定義的變數名，差集為空才算通過。差集不為空時，對應的顏色、字號或尺寸會回退到瀏覽器預設值。</span></div></div>';
}


function specTeam(){
  const repo='https://github.com/RmagSky/dmp';
  const site='https://dmp.arthems.workers.dev/';
  const site2='https://rmagsky.github.io/dmp/';
  return '<div class="spec-crumb">產品基線 / 團隊協作 / 團隊更新與上傳流程</div>'+
    '<h1 class="spec-h1">團隊更新與上傳流程</h1>'+
    '<p class="spec-lead">原型以 Git 倉庫為唯一事實來源，所有人直接在主線 main 上工作。每次動手前先拉取上游，上傳前先合併並驗證，五步按順序執行，不跳步。</p>'+

    '<div class="spec-block"><h3>一、倉庫與入口</h3>'+
      '<table class="spec-table"><thead><tr><th style="width:132px">項</th><th>內容</th></tr></thead><tbody>'+
      '<tr><td>倉庫</td><td><span class="mono-code">'+repo+'</span></td></tr>'+
      '<tr><td>主入口</td><td><span class="mono-code">'+site+'</span>　Cloudflare Workers，省略 <span class="mono-code">.html</span> 後綴</td></tr>'+
      '<tr><td>備用入口</td><td><span class="mono-code">'+site2+'</span>　GitHub Pages，保留 <span class="mono-code">.html</span> 後綴</td></tr>'+
      '<tr><td>主線分支</td><td><span class="mono-code">main</span>，唯一長期分支，不開個人分支</td></tr>'+
      '<tr><td>入口文件</td><td><span class="mono-code">index.html</span> 框架頁 ｜ <span class="mono-code">dmp.html</span> 管理面 ｜ <span class="mono-code">rule.html</span> 產品基線</td></tr>'+
      '<tr><td>共用資源</td><td><span class="mono-code">assets/app.css</span>、<span class="mono-code">assets/core.js</span> 被三個頁面共用，改動影響全部頁面</td></tr>'+
      '<tr><td>發布方式</td><td>推送到 main 後兩個入口同時重建：Cloudflare Workers 立即生效，GitHub Pages 需 30–60 秒構建</td></tr>'+
      '<tr><td>緩存策略</td><td>Cloudflare <span class="mono-code">max-age=0, must-revalidate</span>，每次回源；GitHub Pages <span class="mono-code">max-age=600</span>，HTML 被瀏覽器與 CDN 各緩存 10 分鐘</td></tr>'+
      '</tbody></table>'+
      '<div class="spec-note"><span class="i">'+icon('warn',16)+'</span><span><b>驗證更新時區分兩件事：</b>① 構建延遲 — 推送後 Pages 需 30–60 秒重建，此時訪問確為舊版，等構建完成再看；② 緩存未過期 — 重建已完成但瀏覽器仍顯示舊版，屬 <span class="mono-code">max-age=600</span> 未到期。<span class="mono-code">?v=</span> 版本串只加在 <span class="mono-code">assets/*</span> 上，HTML 文檔本身不受其控制，故改頁面內容時受 10 分鐘緩存約束。用 <span class="mono-code">Ctrl+Shift+R</span> 或無痕窗口核對。</span></div></div>'+

    '<div class="spec-block"><h3>二、五步流程</h3>'+
      '<p class="sub">本地工作目錄即倉庫根目錄，以下指令在根目錄執行。</p>'+
      '<div class="flow">'+

      '<div class="flow-step"><div class="no">1</div><div class="bd">'+
        '<div class="tt">拉取上游</div>'+
        '<div class="ds">動手改文件之前先取遠端最新提交。本地有未提交改動時，先提交或暫存，再拉取。</div>'+
        '<pre class="cmd"><span class="c"># 取遠端並以 rebase 方式併入本地提交</span>\ngit pull --rebase origin main</pre>'+
      '</div></div>'+

      '<div class="flow-step"><div class="no">2</div><div class="bd">'+
        '<div class="tt">檢查新提交</div>'+
        '<div class="ds">確認上游改動了哪些文件、是否與自己本次要改的部分重疊。重疊的部分先讀懂對方的改法，再決定自己的改法。</div>'+
        '<pre class="cmd"><span class="c"># 本地落後的提交</span>\ngit log --oneline HEAD..origin/main\n\n<span class="c"># 上游改了哪些文件</span>\ngit diff --stat HEAD origin/main\n\n<span class="c"># 逐行查看具體改動</span>\ngit diff HEAD origin/main -- dmp.html</pre>'+
      '</div></div>'+

      '<div class="flow-step"><div class="no">3</div><div class="bd">'+
        '<div class="tt">合併</div>'+
        '<div class="ds">把上游提交併入本地工作分支，使本地包含雙方改動。第 1 步已用 <span class="mono-code">--rebase</span> 時，此步只確認結果；直接合併時執行下面的指令。</div>'+
        '<pre class="cmd"><span class="c"># 合併上游，保留雙方歷史</span>\ngit merge origin/main\n\n<span class="c"># 確認合併後本地與上游的差異，只剩自己的改動</span>\ngit status\ngit log --oneline -8</pre>'+
      '</div></div>'+

      '<div class="flow-step"><div class="no">4</div><div class="bd">'+
        '<div class="tt">確認衝突並修正</div>'+
        '<div class="ds">合併或 rebase 出現衝突時，Git 在文件內標記衝突區段，並把文件標為未合併。逐個文件修正後標記解決，再繼續。修正按下方「衝突處理規則」執行，不整段取一邊。</div>'+
        '<pre class="cmd"><span class="c"># 查看衝突文件</span>\ngit status\n\n<span class="c"># 修正後標記為已解決</span>\ngit add dmp.html assets/app.css\n\n<span class="c"># rebase 過程中繼續；merge 過程中改為 git commit</span>\ngit rebase --continue</pre>'+
        '<div class="spec-note red" style="margin-top:12px"><span class="i">'+icon('warn',16)+'</span><span>衝突標記 <span class="mono-code">&lt;&lt;&lt;&lt;&lt;&lt;&lt;</span> / <span class="mono-code">=======</span> / <span class="mono-code">&gt;&gt;&gt;&gt;&gt;&gt;&gt;</span> 必須全部清除。殘留標記會讓整頁腳本失效，頁面白屏。</span></div>'+
      '</div></div>'+

      '<div class="flow-step"><div class="no">5</div><div class="bd">'+
        '<div class="tt">上傳更新</div>'+
        '<div class="ds">本地驗證通過後推送到主線。推送前先按「上傳前檢查清單」自查，推送後確認 Pages 重建成功。</div>'+
        '<pre class="cmd"><span class="c"># 暫存本次改動並提交，提交信息按本頁第四節格式</span>\ngit add -A\ngit commit -m "feat(event-list): 分類頁籤改為由分類樹派生"\n\n<span class="c"># 上傳到主線</span>\ngit push origin main\n\n<span class="c"># 確認本地與遠端一致</span>\ngit status</pre>'+
      '</div></div>'+

      '</div></div>'+

    '<div class="spec-block"><h3>三、衝突處理規則</h3>'+
      '<p class="sub">同一處被兩人改動時按此判定保留哪一側，逐段判斷，不整文件取捨。</p>'+
      '<table class="spec-table"><thead><tr><th style="width:180px">衝突位置</th><th>處理方式</th></tr></thead><tbody>'+
      '<tr><td>頁面 HTML 結構</td><td>雙方新增的功能都保留，按 4.x 組件規範重排位置與樣式，不刪任一方的功能</td></tr>'+
      '<tr><td>CSS 變數區</td><td>配色取上游（配色以源站為準）；字號、間距、圓角取上游（字體按基線規範）</td></tr>'+
      '<tr><td>SPEC_NAV / REQ_LIST 等數組</td><td>雙方新增項全部保留，按編號順序排列，編號重複時順延並同步改引用處</td></tr>'+
      '<tr><td>版本號 / 變更記錄</td><td>合併階段不處理。功能全部合併完成後，取合併後的最新版本為基數升版，並在基數上追加自己的一條記錄；上游歷史行保留不動。詳見 1.1 協作場景的版本衝突</td></tr>'+
      '<tr><td>mock 數據</td><td>保留上游數據集，自己的演示數據另存備份，不覆蓋上游已有條目</td></tr>'+
      '</tbody></table>'+
      '<div class="spec-note"><span class="i">'+icon('warn',16)+'</span><span>拿不準保留哪一側時，先問改動方，不自行刪除他人提交。合併後的頁面必須本地打開驗證，不以「看起來沒錯」作為通過標準。</span></div></div>'+

    '<div class="spec-block"><h3>四、提交信息格式</h3>'+
      '<p class="sub">一行摘要說明改動內容，類型用英文前綴，範圍寫頁面或模塊。</p>'+
      '<pre class="cmd"><span class="c"># 格式：類型(範圍): 摘要</span>\nfeat(event-list): 分類頁籤改為由分類樹派生\nfix(rule): 修正國家過濾彈窗在多選時的計數\nstyle(dmp): 統一表格數值列使用 tabular-nums\ndocs(readme): 補充線上入口與交互清單\nchore: 添加 .nojekyll 禁用 Jekyll 構建</pre>'+
      '<table class="spec-table" style="margin-top:14px"><thead><tr><th style="width:110px">類型</th><th>適用改動</th></tr></thead><tbody>'+
      '<tr><td><span class="mono-code">feat</span></td><td>新增頁面、功能單元、章節、彈窗</td></tr>'+
      '<tr><td><span class="mono-code">fix</span></td><td>修正錯誤：交互失效、樣式錯位、數據錯算</td></tr>'+
      '<tr><td><span class="mono-code">style</span></td><td>字號、配色、間距、位置等視覺調整</td></tr>'+
      '<tr><td><span class="mono-code">docs</span></td><td>README、規範文檔文字</td></tr>'+
      '<tr><td><span class="mono-code">chore</span></td><td>構建、配置、依賴、忽略文件</td></tr>'+
      '</tbody></table></div>'+

    '<div class="spec-block"><h3>五、上傳前檢查清單</h3>'+
      '<p class="sub">五項全部通過再推送，任一項不通過則不上傳。</p>'+
      '<table class="spec-table"><thead><tr><th style="width:52px">序</th><th style="width:220px">檢查項</th><th>通過標準</th></tr></thead><tbody>'+
      '<tr><td class="num">1</td><td>三個頁面可打開</td><td><span class="mono-code">index.html</span>、<span class="mono-code">dmp.html</span>、<span class="mono-code">rule.html</span> 本地打開無控制台報錯，管理面各頁可切換</td></tr>'+
      '<tr><td class="num">2</td><td>版本號與變更記錄</td><td>三處展示位、<span class="mono-code">core.js</span> 的 <span class="mono-code">VERSION</span>、1.1 記錄表首行三者相同，且記錄表已補入本次變更</td></tr>'+
      '<tr><td class="num">3</td><td>靜態資源版本串</td><td>改動過 <span class="mono-code">assets/*</span> 時同步更新 <span class="mono-code">?v=</span> 串，避免瀏覽器用舊緩存</td></tr>'+
      '<tr><td class="num">4</td><td>無臨時文件</td><td>不含 <span class="mono-code">node_modules</span>、截圖、備份文件、編輯器配置</td></tr>'+
      '<tr><td class="num">5</td><td>改動範圍可控</td><td><span class="mono-code">git status</span> 列出的文件都是本次有意修改的</td></tr>'+
      '</tbody></table>'+
      '<div class="spec-note blue"><span class="i">'+icon('info',16)+'</span><span>推送後打開主入口確認：頁面可加載、字體正常（<span class="mono-code">_fonts/</span> 未 404）、改動處生效。Pages 重建期間訪問可能仍為舊版本，等重建完成再判斷。</span></div></div>'+

    '<div class="spec-block"><h3>六、禁止事項</h3>'+
      '<table class="spec-table"><thead><tr><th style="width:200px">禁止操作</th><th>原因與替代做法</th></tr></thead><tbody>'+
      '<tr><td>強制推送</td><td><span class="mono-code">git push --force</span> 會覆蓋他人提交。改用 <span class="mono-code">--force-with-lease</span>，且僅限自己剛推送且無人基於其工作的分支</td></tr>'+
      '<tr><td>改寫歷史提交</td><td>已推送的提交不改寫、不 squash。需撤銷時用新提交反向修改</td></tr>'+
      '<tr><td>直接改主線共享文件不拉取</td><td><span class="mono-code">app.css</span>、<span class="mono-code">core.js</span> 被三頁共用，改前必拉取，改後必驗證三頁</td></tr>'+
      '<tr><td>把 mock 數據當真實接口</td><td>原型不含後端，接口路徑僅作示意，不對接真實環境</td></tr>'+
      '</tbody></table></div>';
}
